<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted (see @font-face in src/styles/global.css) — no
         external font requests, nothing render-blocking beyond our own CSS. -->
    <title>Napat Kasemweerasan — Computer Engineering & ML/Quant Finance Portfolio</title>
    <!-- SEO: description derived verbatim from docs/content.md (Hero + About). -->
    <meta
      name="description"
      content="Portfolio of Napat Kasemweerasan, a Computer Engineering student at KMUTT passionate about applying Machine Learning to Quantitative Finance — uncovering patterns and generating value from data."
    />
    <!-- Canonical URL for the deployed site. -->
    <link rel="canonical" href="https://napat-sun-portfolio.vercel.app/" />
    <!-- Open Graph (step 10.4). Absolute URLs so social crawlers resolve them. -->
    <meta property="og:url" content="https://napat-sun-portfolio.vercel.app/" />
    <meta
      property="og:title"
      content="Napat Kasemweerasan — Computer Engineering & ML/Quant Finance Portfolio"
    />
    <meta
      property="og:description"
      content="Computer Engineering student bridging Engineering, Machine Learning & Quantitative Finance — projects in ML forecasting, databases, and RAG chatbots."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://napat-sun-portfolio.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <!-- Twitter/X link previews use the same share asset. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Napat Kasemweerasan — Computer Engineering & ML/Quant Finance Portfolio"
    />
    <meta
      name="twitter:description"
      content="Computer Engineering student bridging Engineering, Machine Learning & Quantitative Finance — projects in ML forecasting, databases, and RAG chatbots."
    />
    <meta name="twitter:image" content="https://napat-sun-portfolio.vercel.app/og-image.png" />
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong one.
      // Default is dark for first-time visitors; a saved 'light' still wins.
      // Key must stay in sync with STORAGE_KEY in src/hooks/useTheme.tsx.
      (function () {
        try {
          if (localStorage.getItem('theme') !== 'light') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* localStorage unavailable — fall back to dark mode */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
